<div class="container">
  <div class="form-container">
    <h2>{{ isEditing ? 'Editar Cliente' : 'Cadastrar Novo Cliente' }}</h2>

    <form [formGroup]="clientForm" (ngSubmit)="submitClient()">
      <div class="form-group">
        <label for="firstName">Nome</label>
        <input id="firstName" formControlName="firstName" required>
      </div>

      <div class="form-group">
        <label for="lastName">Sobrenome</label>
        <input id="lastName" formControlName="lastName" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" required>
      </div>

      <div class="form-group">
        <label for="cpfOuCnpj">CPF/CNPJ</label>
        <input id="cpfOuCnpj" formControlName="cpfOuCnpj" required>
      </div>

      <div class="form-actions">
        <button type="submit" class="submit-btn" [disabled]="clientForm.invalid">
          {{ isEditing ? 'Atualizar' : 'Salvar' }}
        </button>

        <button *ngIf="isEditing" type="button" class="cancel-btn" (click)="cancelEdit()">
          Cancelar
        </button>
      </div>
    </form>
  </div>

  <div class="table-container">
    <h2>Clientes Cadastrados</h2>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Sobrenome</th>
          <th>Email</th>
          <th>CPF/CNPJ</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let client of allClients | paginate: { itemsPerPage: itemsPerPage, currentPage: p }">
          <td>{{ client.id }}</td>
          <td>{{ client.firstName }}</td>
          <td>{{ client.lastName }}</td>
          <td>{{ client.email }}</td>
          <td>{{ client.cpfOuCnpj }}</td>
          <td class="actions">
            <button class="edit-btn" (click)="editClient(client)">Editar</button>
            <button class="delete-btn" (click)="deleteClient(client.id)">Excluir</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="pagination-container">
      <pagination-controls
        (pageChange)="onPageChange($event)"
        previousLabel="Anterior"
        nextLabel="Próximo"
        class="pagination">
      </pagination-controls>
    </div>
  </div>
</div>
